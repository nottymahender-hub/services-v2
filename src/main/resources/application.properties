spring.datasource.url=jdbc:mariadb://localhost:3306/grc_orl2_db
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.flyway.baseline-on-migrate=true
spring.flyway.table=schema_version_orl2

# Console log line format. Access logging (per-request start/stop) can be enabled if needed via
# server.tomcat.accesslog.enabled=true; it is intentionally off by default.
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
