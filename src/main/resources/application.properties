spring.datasource.url=jdbc:mariadb://localhost:3306/grc_orl2_db
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.flyway.baseline-on-migrate=true
spring.flyway.table=schema_version_orl2

# Include the request username (populated by RequestLoggingFilter via MDC) in every log line.
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [user=%X{username:-}] %logger{36} - %msg%n
