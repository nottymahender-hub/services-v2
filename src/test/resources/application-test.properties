# H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;NON_KEYWORDS=VALUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Initialise schema from test SQL script
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-test.sql

# Disable Flyway for tests (schema is created by spring.sql.init above)
spring.flyway.enabled=false
